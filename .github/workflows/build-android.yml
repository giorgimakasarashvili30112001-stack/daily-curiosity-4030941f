name: Build Android App (APK & AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed only so the optional "Attach files to GitHub Release" step can upload
# assets when you push a tag.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check APP_URL is configured
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error title=APP_URL is not set::Add a repository VARIABLE named APP_URL (your deployed site, e.g. https://dailyhow.example.com) under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error title=APP_URL must start with https://::Got '$APP_URL'"; exit 1 ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # `packages: ''` skips the action's default install of the legacy `tools`
      # package, which Google no longer publishes and which made sdkmanager fail
      # with "Failed to find package 'tools'". The action still installs the
      # command-line tools, accepts the licenses and puts sdkmanager on PATH.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # Must match compileSdkVersion in android/variables.gradle and the AGP
      # version's default build-tools in android/build.gradle.
      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      # The app loads the deployed site (server.url), so no web build is needed here.
      - name: Sync Capacitor Android project
        env:
          # Repository variable: Settings > Secrets and variables > Actions > Variables
          APP_URL: ${{ vars.APP_URL }}
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode signing keystore (optional)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "$KEYSTORE_FILE" | base64 -d > android/app/release.keystore
          else
            echo "No keystore secret set - release build will be unsigned."
          fi

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
